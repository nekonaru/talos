name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Restore signing keystore
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_B64 }}" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "${{ secrets.KEYSTORE_STORE_PASSWORD }}" \
            "${{ secrets.KEYSTORE_STORE_PASSWORD }}" \
            "${{ secrets.KEYSTORE_KEY_ALIAS }}" > android/app/key.properties

      - name: Build debug APK
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --debug

      - name: Build signed release APK (arm64-v8a)
        if: github.event_name == 'push'
        run: |
          flutter gen-l10n
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Normalize and verify release signature
        if: github.event_name == 'push'
        run: |
          set -e
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          # Verify the signed artifact before it is published. minSdk 24 and
          # targetSdk 36 mean v2 is the correct scheme here; v1 is neither
          # required nor accepted by modern Android for this target.
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner-verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner-verify.txt
          grep -q "CN=Talos" apksigner-verify.txt
          # The release must never contain x86_64 libraries.
          if unzip -l "$APK" | grep -q 'lib/x86_64/'; then
            echo "Unexpected x86_64 libraries in release APK"
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" > /dev/null
          sha256sum "$APK" | tee release-sha256.txt

      - name: Upload release APK (arm64-v8a)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: talos-release-apk-arm64
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            release-sha256.txt
            apksigner-verify.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: talos-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Build Windows
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: talos-windows-x64
          path: build/windows/x64/runner/Release/

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Build Linux
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build linux --release

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: talos-linux-x64
          path: build/linux/x64/release/bundle/

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Build macOS
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build macos --release

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: talos-macos
          path: build/macos/Build/Products/Release/
